name: Publish Extension

# Publishes the extension to the Visual Studio Marketplace.
#
# Triggers:
#   - pushing a version tag (e.g. `v0.2.0`)
#   - manually from the Actions tab ("Run workflow")
#
# Authentication: Marketplace Trusted Publishing (OIDC), no stored secret.
# The `sindarincorp` publisher has a trusted publishing policy for this
# repository and this workflow file (Marketplace > Manage Publishers >
# Trusted Publishing). Global Azure DevOps PATs are retired on 1 Dec 2026,
# so the former VSCE_PAT secret is no longer used.
#
# The sindarin-grammar submodule is public, so it is checked out with the
# default token (no extra secret required).

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          submodules: recursive

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Verify tag matches package.json version
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          TAG_VERSION="${GITHUB_REF_NAME#v}"
          PKG_VERSION="$(node -p "require('./package.json').version")"
          if [ "$TAG_VERSION" != "$PKG_VERSION" ]; then
            echo "::error::Tag $GITHUB_REF_NAME does not match package.json version $PKG_VERSION"
            exit 1
          fi

      - run: npm run check-types

      - run: npm run lint

      - name: Run integration tests
        run: xvfb-run -a npm test

  publish:
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v5
        with:
          submodules: recursive

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Package extension
        run: npm run package-vsix

      # --oidc first shipped in @vscode/vsce 4.1.0; the version is pinned so a
      # new vsce release cannot change what publishes.
      - name: Publish to Visual Studio Marketplace
        run: npx --yes @vscode/vsce@4.1.0 publish --oidc --packagePath sindarin-lang.vsix

      - name: Upload .vsix artifact
        uses: actions/upload-artifact@v5
        with:
          name: sindarin-lang-vsix
          path: sindarin-lang.vsix
